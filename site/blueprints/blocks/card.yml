name: Card
icon: box
preview: fields
wysiwyg: true
fields:
  heading:
    label: Heading
    type: writer
    inline: true
    marks:
      - italic
      - underline
      - link
      - clear
  width:
    label: Width
    type: toggles
    default: wide
    options:
      normal: 1/4 column
      wide: 1/2 column
  body:
    label: Body text
    type: writer
    marks:
      - bold
      - italic
      - underline
      - link
      - email
      - clear
    nodes:
      - bulletList
      - orderedList
  collect:
    extends: fields/collect
