title: Climate ReAssemblies

tabs:
  pages:
    label: Pages
    icon: page
    columns:
      main:
        width: 2/3
        sections:
          pages:
            label: Pages
            help: Published (listed) pages appear in the main navigation.
            type: pages
            templates:
              - home
              - resources
              - default
      sidebar:
        width: 1/3
        sections:
          meta:
            type: fields
            fields:
              description:
                label: Site description
                help: Used by search engines and when the site is shared.
                type: textarea
                buttons: false
                size: small

  navigation:
    label: Navigation
    icon: menu
    fields:
      navLinks:
        label: External links
        help: Shown in the navigation before the site's own pages. They open in a new tab.
        type: structure
        fields:
          label:
            label: Label
            type: text
            required: true
            width: 1/3
          url:
            label: URL
            type: url
            required: true
            width: 2/3

  collection:
    label: Collect & ReAssemble
    icon: star
    fields:
      collectionTitle:
        label: Tab title
        type: text
        placeholder: Collect & ReAssemble
      collectionIntro:
        label: Introduction
        help: Each paragraph is shown as a large heading. Type {icon} where the collect icon should appear.
        type: writer
        marks:
          - bold
          - italic
          - underline
          - link
          - email
          - clear
        nodes:
          - bulletList
          - orderedList
      collectionEmpty:
        label: Empty collection message
        type: text
        placeholder: Your collection is still empty

  footer:
    label: Footer
    icon: info
    columns:
      contact:
        width: 1/2
        fields:
          contactTitle:
            label: Title
            type: text
          contactText:
            label: Text
            help: One entry per line.
            type: textarea
            buttons: false
            size: small
          email:
            label: Email
            type: email
          copyright:
            label: Copyright line
            help: The © symbol and the current year are added automatically.
            type: text
      lists:
        width: 1/2
        fields:
          credits:
            label: Credits
            type: structure
            fields:
              role:
                label: Role
                type: text
                width: 1/2
              name:
                label: Name
                type: text
                width: 1/2
          legalLinks:
            label: Legal links
            type: structure
            fields:
              label:
                label: Label
                type: text
                width: 1/2
              link:
                label: Link
                type: link
                options:
                  - page
                  - url
                width: 1/2
      partnersColumn:
        width: 1/1
        fields:
          partners:
            label: Partners
            type: structure
            fields:
              logo:
                label: Logo
                type: files
                query: site.files.template("logo")
                uploads: logo
                multiple: false
                width: 1/3
              name:
                label: Name
                type: text
                required: true
                width: 1/3
              link:
                label: Website
                type: url
                width: 1/3
